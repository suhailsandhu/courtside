name: Courtside
options:
  bundleIdPrefix: com.courtside.personal
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Courtside:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.courtside.personal.probe
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: Courtside Test
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: Courtside Diagnostic
            CFBundleURLSchemes: [courtside-probe]
    dependencies:
      - target: CourtsideWidget
        embed: true
  CourtsideWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.courtside.personal.probe.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: Courtside Test Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  CourtsideTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Courtside
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Courtside:
    build:
      targets:
        Courtside: all
        CourtsideWidget: all
    test:
      targets: [CourtsideTests]
