name: Native widget installation probe
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: courtside-probe
  cancel-in-progress: true
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record tools and generate Xcode project
        run: |
          set -euo pipefail
          mkdir -p out
          xcodebuild -version | tee out/toolchain.txt
          brew install xcodegen
          xcodegen --version | tee -a out/toolchain.txt
          xcodegen generate
      - name: Run simulator unit tests
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > out/simulators.json
          DEVICE=$(python3 -c 'import json; d=json.load(open("out/simulators.json")); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcodebuild test -project Courtside.xcodeproj -scheme Courtside -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/simulator -resultBundlePath out/Tests.xcresult CODE_SIGNING_ALLOWED=NO | tee out/tests.log
      - name: Compile unsigned physical-device app and widget
        run: |
          set -euo pipefail
          xcodebuild build -project Courtside.xcodeproj -scheme Courtside -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee out/device-build.log
          python3 scripts/package_probe.py build/device/Build/Products/Release-iphoneos/Courtside.app out
      - name: Upload unsigned IPA and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Courtside-UNSIGNED-probe
          path: out/
          retention-days: 3
          if-no-files-found: error
